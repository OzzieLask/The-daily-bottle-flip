<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f4" />
    <title>Daily Bottle Flip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div id="stage">01 · Kitchen counter</div>
      <div id="hud-actions" class="hidden">
        <button id="btn-test" class="toggle">Test</button>
        <button id="btn-reset">Reset</button>
      </div>
      <div id="callout" class="hidden">
        <div id="callout-main"></div>
        <div id="callout-stars"></div>
        <div id="callout-sub"></div>
      </div>
      <div id="guide-wrap" class="hidden">
        <div id="guide"></div>
        <p id="guide-text"></p>
      </div>
      <div id="hud-meters" class="hidden"></div>
      <div id="stats"></div>
    </div>

    <div id="stagecard" class="hidden">
      <div class="sc-num">01</div>
      <div class="sc-name">Kitchen counter</div>
    </div>

    <div id="title" class="screen">
      <div class="sheet">
        <h1>Daily<br />Bottle Flip</h1>
        <button id="start">Start</button>
      </div>
    </div>

    <div id="message" class="screen hidden">
      <div class="sheet">
        <h2 id="message-title"></h2>
        <p id="message-body"></p>
        <button id="message-btn" class="hidden"></button>
      </div>
    </div>

    <div id="pair" class="screen hidden">
      <div class="sheet">
        <h2 id="pair-title">Scan with your phone</h2>
        <canvas id="qr"></canvas>
        <div id="pair-code"></div>
        <p id="pair-status"></p>
      </div>
    </div>

    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
